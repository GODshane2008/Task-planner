<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Growth OS</title>

    <link rel="stylesheet"
          href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

    <div class="background-blur"></div>

    <div class="app-container">

        <!-- Sidebar -->

        <aside class="sidebar">

            <div class="logo">
                🚀 Growth OS
            </div>

            <nav>

                <a href="#">
                    📊 Dashboard
                </a>

                <a href="#">
                    📝 Tasks
                </a>

                <a href="#">
                    📈 Analytics
                </a>

                <a href="#">
                    🏆 Achievements
                </a>

                <a href="#">
                    ⚙ Settings
                </a>

            </nav>

        </aside>

        <!-- Main Content -->

        <main class="main-content">

            <!-- Header -->

            <header class="header">

                <div>

                    <h1>
                        Welcome Back Shane 👋
                    </h1>

                    <p>
                        Keep growing every day.
                    </p>

                </div>

                <button class="premium-btn">
                    + New Task
                </button>

            </header>

            <!-- Stats -->

            <section class="stats-grid">

                <!-- XP -->

                <div class="glass-card xp-card">

                    <h3>XP</h3>

                    <div class="xp-ring">

                        <div
                            class="xp-value"
                            id="xpValue">

                            0

                        </div>

                    </div>

                </div>

                <!-- Streak -->

                <div class="glass-card">

                    <h3>
                        🔥 Current Streak
                    </h3>

                    <p
                        class="big-number"
                        id="streakValue">

                        0 Days

                    </p>

                </div>

                <!-- Level -->

                <div class="glass-card">

                    <h3>
                        ⭐ Level
                    </h3>

                    <p
                        class="big-number"
                        id="levelValue">

                        1

                    </p>

                </div>

            </section>

            <!-- Tasks -->

            <section class="glass-card">

                <div class="section-title">

                    <h2>
                        Today's Tasks
                    </h2>

                </div>

                <div class="task-input-container">

                    <input
                        type="text"
                        id="taskInput"
                        placeholder="Enter a new task...">

                    <button id="addTaskBtn">
                        Add
                    </button>

                </div>

                <ul id="taskList">

                </ul>

            </section>

            <!-- Analytics -->

            <section class="analytics-grid">

                <div class="glass-card">

                    <h2>
                        Monthly Progress
                    </h2>

                    <canvas id="progressChart">

                    </canvas>

                </div>

                <div class="glass-card">

                    <h2>
                        Activity Heatmap
                    </h2>

                    <div id="heatmap">

                    </div>

                </div>

            </section>

            <!-- Achievements -->

            <section class="glass-card">

                <h2>
                    Achievements
                </h2>

                <div
                    class="badge-container"
                    id="badgeContainer">

                </div>

            </section>

        </main>

    </div>

    <script src="script.js"></script>

</body>

</html>
